services:
  # ----------------------------------------------------
  # 1. RADIUS Server (FreeRADIUS)
  # ----------------------------------------------------
  freeradius:
    build: ./freeradius
    container_name: sso_radius
    ports:
    - "1812:1812/udp"
    - "1813:1813/udp" # accounting
    networks:
    - kmitl_sso_net
    restart: unless-stopped

  # ----------------------------------------------------
  # 2. Central Auth Service (SSO API)
  # ----------------------------------------------------
  central-auth:
    build: ./central-auth
    container_name: sso_central_auth
    environment:
      - PORT=${AUTH_PORT}
      - RADIUS_HOST=${RADIUS_HOST}
      - RADIUS_PORT=${RADIUS_PORT}
      - RADIUS_SECRET=${RADIUS_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
    volumes:
      - ./central-auth:/app
      - /app/node_modules
    networks:
      - kmitl_sso_net
    depends_on:
      - freeradius
    restart: unless-stopped

  # ----------------------------------------------------
  # 3. MySQL Database (E-commerce)
  # ----------------------------------------------------
  mysql-db:
    image: mysql:8.0
    container_name: ecom_mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - kmitl_sso_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ----------------------------------------------------
  # 4. Frontend (Next.js)
  # ----------------------------------------------------
  frontend-next:
    build: ./frontend-next
    container_name: ecom_frontend
    environment:
      - NODE_ENV=development
      - JWT_SECRET=${JWT_SECRET}
    command: npm run dev
    volumes:
      - ./frontend-next:/app
      - /app/node_modules
      - /app/.next
    networks:
      - kmitl_sso_net
    restart: unless-stopped

  # ----------------------------------------------------
  # 5. Backend Worker (Python)
  # ----------------------------------------------------
  backend-python:
    build: ./backend-python
    container_name: ecom_backend_python
    ports:
      - "8000:8000"
    volumes:
      - ./backend-python:/app
    environment:
      - PORT=${WORKER_API_PORT}
      - DATABASE_URL=mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql-db:3306/${MYSQL_DATABASE}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      mysql-db:
        condition: service_healthy
    networks:
      - kmitl_sso_net
    restart: unless-stopped

  # ----------------------------------------------------
  # 6. Nginx (Reverse Proxy & Load Balancer)
  # ----------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: sso_nginx_proxy
    ports:
      - "8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - central-auth
      - frontend-next
      - backend-python
    networks:
      - kmitl_sso_net

networks:
  kmitl_sso_net:
    driver: bridge

volumes:
  mysql_data:
