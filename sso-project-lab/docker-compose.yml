version: '3.8'

services:
  # ----------------------------------------------------
  # 1. RADIUS Server (FreeRADIUS)
  # ----------------------------------------------------
  freeradius:
    build: ./freeradius
    container_name: sso_radius
    ports:
      - "1812:1812/udp"
    environment:
      # จำลอง Client (Network ที่อนุญาต) และ Shared Secret
      - RAD_CLIENTS=172.16.0.0/12@testing123
      # จำลองข้อมูลนักศึกษาสำหรับทดสอบเข้าสู่ระบบ (username@password)
      - RAD_USERS=student66000001@password1234,admin66000001@password1234
    networks:
      - kmitl_sso_net

  # ----------------------------------------------------
  # 2. Central Auth Service (SSO API)
  # ----------------------------------------------------
  central-auth:
    build: ./central-auth
    container_name: sso_central_auth
    environment:
      - PORT=3000
      - RADIUS_HOST=freeradius
      - RADIUS_SECRET=testing123
      - JWT_SECRET=kmitl_chumphon_sso_secret_key
    volumes:
      - ./central-auth:/app
      - /app/node_modules
    networks:
      - kmitl_sso_net
    depends_on:
      - freeradius
    restart: unless-stopped

  # ----------------------------------------------------
  # 3. MySQL Database (E-commerce)
  # ----------------------------------------------------
  mysql-db:
    image: mysql:8.0
    container_name: ecom_mysql
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=ecommerce_db
      - MYSQL_USER=ecom_user
      - MYSQL_PASSWORD=ecom_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - kmitl_sso_net
    restart: unless-stopped

  # ----------------------------------------------------
  # 4. Frontend (Next.js)
  # ----------------------------------------------------
  frontend-next:
    build: ./frontend-next
    container_name: ecom_frontend
    environment:
      - NODE_ENV=development
    command: npm run dev
    volumes:
      - ./frontend-next:/app
      - /app/node_modules
      - /app/.next
    networks:
      - kmitl_sso_net
    restart: unless-stopped

  # ----------------------------------------------------
  # 6. Backend Worker (Python)
  # ----------------------------------------------------
  backend-python:
    build: ./backend-python
    container_name: ecom_backend_python
    ports:
      - "8000:8000"
    volumes:
      - ./backend-python:/app
    environment:
      - PORT=8000
      - DATABASE_URL=mysql://ecom_user:ecom_password@mysql-db:3306/ecommerce_db
      - SECRET_KEY=kmitl_chumphon_sso_secret_key
    depends_on:
      - mysql-db
    networks:
      - kmitl_sso_net
    restart: unless-stopped

  # ----------------------------------------------------
  # 7. Nginx (Reverse Proxy & Load Balancer)
  # ---------------------------------------------------- 
  nginx:
    image: nginx:alpine
    container_name: sso_nginx_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - central-auth
      - frontend-next
      - backend-python
    networks:
      - kmitl_sso_net

networks:
  kmitl_sso_net:
    driver: bridge

volumes:
  mysql_data:
