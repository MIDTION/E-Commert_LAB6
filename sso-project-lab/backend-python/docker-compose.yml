version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: ecom_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ecom_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  web:
    build: .
    container_name: ecom_fastapi
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override localhost with the name of the db service
      - MYSQL_SERVER=db
    depends_on:
      - db

volumes:
  mysql_data:
