# ----- localhost: for testing with radtest from inside the container itself -----
client localhost {
    ipaddr = 127.0.0.1
    secret = testing123
    require_message_authenticator = no
    nas_type = other
}

# ----- every container on the Docker subnet (this is our central-auth) -----
client docker_net {
    ipaddr = 172.16.0.0
    netmask = 12
    secret = testing123
    require_message_authenticator = no
    shortname = sso-docker
}
