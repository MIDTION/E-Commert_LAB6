<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TPEJ STORE | Login</title>
  <link rel="stylesheet" href="/auth/style.css">
  <!-- Note: We use /auth/style.css because Nginx proxies /auth/ to this service -->
</head>

<body>

  <div class="background-container">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <main class="login-container">
    <div class="login-card">
      <div class="logo-container">
        <svg xmlns="http://www.w3.org/2000/svg" class="icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
            d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      </div>

      <h1 class="title">TPEJ <span style="color: #f97316;">STORE</span></h1>
      <p class="subtitle">เข้าสู่ระบบเพื่อใช้งาน Game ID Marketplace</p>

      <div id="error-message" class="alert hidden">
        <span id="error-text">Invalid username or password</span>
      </div>

      <form id="login-form">
        <div class="input-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="Enter your username" required
            autocomplete="username">
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required
            autocomplete="current-password">
        </div>

        <button type="submit" id="submit-btn" class="submit-btn">
          <span id="btn-text">Sign In</span>
          <div id="btn-loader" class="loader hidden"></div>
        </button>
      </form>

      <div class="footer">
        Powered by TPEJ STORE
      </div>
    </div>
  </main>

  <script src="/auth/script.js"></script>
</body>

</html>
