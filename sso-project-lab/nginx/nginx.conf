events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name localhost;

        # 1. Routing สำหรับ Central Auth Service (หน้า Login)
        location /api/auth/ {
            proxy_pass http://central-auth:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Fallback alias สำหรับ /auth/login
        location = /auth/login {
            proxy_pass http://central-auth:3000/login;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }



        # 3. Routing สำหรับ Worker API (Python)
        location /api/worker/ {
            proxy_pass http://backend-python:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 4. Routing สำหรับหน้าหลัก (Next.js Frontend)
        location / {
            proxy_pass http://frontend-next:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # ส่งผ่านข้อมูล Cookie เพื่อให้แอปปลายทางนำ JWT ไปตรวจสอบ
            proxy_pass_header Set-Cookie;
            
            # WebSocket support for Next.js HMR (Fast Refresh)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
