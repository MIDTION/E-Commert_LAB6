events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name localhost;
        client_max_body_size 10M;

        # 1. Routing สำหรับ Central Auth Service (หน้า Login)
        location /auth/ {
            proxy_pass http://central-auth:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. Routing สำหรับ E-commerce API (Node.js)
        location /api/shop/ {
            proxy_pass http://backend-node:5000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3. Routing สำหรับ Worker API (Python)
        location /api/worker/ {
            proxy_pass http://backend-python:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 4. Routing สำหรับหน้าหลัก (Next.js Frontend)
        location / {
            proxy_pass http://frontend-next:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # ส่งผ่านข้อมูล Cookie เพื่อให้แอปปลายทางนำ JWT ไปตรวจสอบ
            proxy_pass_header Set-Cookie;

            # --- เพิ่ม 3 บรรทัดนี้เพื่อรองรับ WebSocket ของ Next.js ---
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
