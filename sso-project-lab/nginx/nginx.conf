```nginx
events {
 worker_connections 1024;
}
http {
 # 1. Routing สำหรับ Central Auth Service (หน้า Login)
 server {
 listen 80;
 server_name localhost;
 # ถ้าผู้ใช้เข้า URL ที่ขึ้นต้นด้วย /auth หรือ /api/login ให้ส่งไปที่ central-auth
 location /auth/ {
 proxy_pass http://central-auth:3000/;
 proxy_set_header Host $host;
 proxy_set_header X-Real-IP $remote_addr;
 }
 # 2. Routing สำหรับระบบจองห้องแล็บ (Web App 1)
 # ถ้าเข้า URL ปกติ หรือ /lab ให้ส่งไปที่ web-app-1
 location /lab/ {
 proxy_pass http://web-app-1:4000/;
 proxy_set_header Host $host;
 proxy_set_header X-Real-IP $remote_addr;

 # ส่งผ่านข้อมูล Cookie เพื่อให้แอปปลายทางนำ JWT ไปตรวจสอบ
 proxy_pass_header Set-Cookie;
 }

 # หน้าหลัก (Root) ให้ Redirect ไปที่หน้าเว็บแล็บชั่วคราว
 location = / {
 return 301 /lab/;
 }
 }
}
```
